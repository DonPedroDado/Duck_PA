<!DOCTYPE html>
<html>

<head>
    <title>Duck Practice Assistant</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        .logo-container {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem 2rem;
            margin-bottom: 1rem;
            background: #fff;
            text-align: center;
        }

        .logo {
            width: 50px;
            height: auto;
            border-radius: 8px;
            margin: 0;
        }

        .logo.error {
            display: none;
        }

        h1 {
            color: #1e40af;
            margin: 0;
            font-size: 1.5rem;
            flex: 1;
            text-align: center;
        }

        h2 {
            margin: 0;
            font-size: 1.25rem;
            color: #1f2937;
        }

        .button-group {
            margin-top: auto;
            padding: 1rem 2rem;
            position: sticky;
            bottom: 0;
            background: white;
            border-top: 1px solid #e5e7eb;
            display: flex;
            justify-content: center;
            width: 100%;
            box-sizing: border-box;
        }

        .primary-button {
            padding: 0.75rem 2rem;
            background-color: #4f46e5;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s;
            width: 100%;
            max-width: 200px;
        }

        .primary-button:hover {
            background-color: #4338ca;
        }

        .form-container {
            flex: 1;
            padding: 0 2rem;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: #4b5563;
            font-weight: 500;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 0.5rem;
            border: 1px solid #e5e7eb;
            border-radius: 6px;
            font-size: 0.875rem;
        }

        .form-section {
            margin-bottom: 1.5rem;
        }

        .sidebar {
            min-width: 450px;
            width: 450px;
            height: 100vh;
            position: fixed;
            left: 0;
            top: 0;
            background: #fff;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        .divider {
            width: 4px;
            height: 100vh;
            background: #e5e7eb;
            position: fixed;
            left: 450px;
            top: 0;
            cursor: col-resize;
            z-index: 100;
            transition: background-color 0.2s;
        }

        .divider:hover {
            background: #4f46e5;
        }

        .content {
            margin-left: 454px;
            padding: 2rem;
            min-height: 100vh;
            background: #f9fafb;
        }

        .welcome-message {
            padding: 1.5rem 0;
        }

        body {
            margin: 0;
            overflow-x: hidden;
            user-select: none;
        }
    </style>
</head>

<body>
    <div class="sidebar">
        <div class="logo-container">
            <img src="{{ url_for('static', filename='images/logo.png') }}" 
                 alt="DuckSoft Logo" 
                 class="logo"
                 onerror="this.classList.add('error')"
                 onload="this.classList.remove('error')">
            <h1>Duck Practice Assistant</h1>
        </div>
        <div class="form-container">
            <section class="form-section">
                <h2>Test Details</h2>
                <div class="form-group">
                    <label for="test-topic">Topic</label>
                    <textarea id="test-topic" rows="3" placeholder="Enter test topic" required></textarea>
                </div>

                <div class="form-group">
                    <label for="test-type">Test Type</label>
                    <select id="test-type" required>
                        <option value="Multiple Choice Tests">Multiple Choice</option>
                        <option value="True/False Tests">True/False</option>
                        <option value="Fill-in-the-Blank Tests">Fill in the Blank</option>
                        <option value="Essay Tests">Essay Test</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="test-difficulty">Difficulty Level</label>
                    <select id="test-difficulty" required>
                        <option value="Super Easy">Super Easy</option>
                        <option value="Easy">Easy</option>
                        <option value="Normal" selected>Normal</option>
                        <option value="Hard">Hard</option>
                        <option value="Very hard">Very Hard</option>
                        <option value="PhD level">PhD Level</option>
                        <option value="Even harder than PhD level">Beyond PhD</option>
                        <option value="Impossible">Impossible</option>
                        <option value="Super impossible">Super Impossible</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="test-questionsnumber">Number of Questions</label>
                    <input type="number" id="test-questionsnumber" min="1" max="100" value="5" required>
                </div>

                <div class="form-group">
                    <label for="test-language">Language</label>
                    <input type="text" id="test-language" placeholder="e.g., English" value="English" required>
                </div>
            </section>

            <div class="button-group">
                <button class="primary-button" onclick="generateTest()">Generate Test</button>
            </div>
        </div>
    </div>
    <div class="divider"></div>
    <div class="content" id="result-area">
        <div class="welcome-message">
            <h2>Welcome to the Duck Practice Assistant</h2>
            <p>Select your options on the left and click "Generate Test" to begin.</p>
        </div>
    </div>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    <script>
        const sidebar = document.querySelector('.sidebar');
        const divider = document.querySelector('.divider');
        const content = document.querySelector('.content');
        let isDragging = false;

        divider.addEventListener('mousedown', (e) => {
            isDragging = true;
            document.body.style.cursor = 'col-resize';
        });

        document.addEventListener('mousemove', (e) => {
            if (!isDragging) return;

            const newWidth = Math.max(450, e.clientX);
            sidebar.style.width = newWidth + 'px';
            divider.style.left = newWidth + 'px';
            content.style.marginLeft = (newWidth + 4) + 'px';
        });

        document.addEventListener('mouseup', () => {
            isDragging = false;
            document.body.style.cursor = '';
        });
    </script>
</body>

</html>
